name: soi
description: SWAG of India. Volunteering drives with NGO-countersigned hours and certificates anyone can verify.
publish_to: 'none'

# versionName+versionCode. The build number must always be greater than the
# latest versionCode on Google Play; pass --build-number at release time to
# override (see docs/RELEASE.md).
version: 2.0.0+6

environment:
  sdk: ^3.13.2

# Each device capability is justified in docs/DECISIONS.md. The merged
# Android manifest must contain only CAMERA and INTERNET.
dependencies:
  app_settings: ^9.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  screen_brightness: ^2.1.11
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Adaptive launcher icons generated from the brand layers:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  adaptive_icon_background: assets/brand/icon-background.png
  adaptive_icon_monochrome: assets/brand/icon-monochrome.png
  min_sdk_android: 24
