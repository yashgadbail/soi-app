name: Android CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      play_track:
        description: Upload the bundle to Google Play on this track ("none" only builds)
        required: true
        default: none
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production
      rollout_fraction:
        description: Share of users for a staged production rollout, between 0.01 and 1 (1 = everyone). Ignored on other tracks.
        required: false
        default: '0.1'
        type: string
      publish_release:
        description: Create a GitHub Release from this build
        required: true
        default: false
        type: boolean

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Dart dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
      version_name: ${{ steps.number.outputs.version_name }}
    env:
      ANDROID_BUILD_NUMBER: ${{ vars.ANDROID_BUILD_NUMBER }}
      PLAY_TRACK: ${{ inputs.play_track || 'none' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Dart dependencies
        run: flutter pub get

      # A production upload is built from SOI_DART_DEFINES_PRODUCTION and from
      # nothing else: if that secret is missing the job stops rather than
      # falling back to the default (dev) configuration.
      - name: Write build configuration
        env:
          SOI_DART_DEFINES: ${{ secrets.SOI_DART_DEFINES }}
          SOI_DART_DEFINES_PRODUCTION: ${{ secrets.SOI_DART_DEFINES_PRODUCTION }}
          SOI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOI_UPLOAD_KEYSTORE_BASE64 }}
          SOI_UPLOAD_STORE_PASSWORD: ${{ secrets.SOI_UPLOAD_STORE_PASSWORD }}
          SOI_UPLOAD_KEY_ALIAS: ${{ secrets.SOI_UPLOAD_KEY_ALIAS }}
          SOI_UPLOAD_KEY_PASSWORD: ${{ secrets.SOI_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$PLAY_TRACK" = production ]; then
            if [ -z "$SOI_DART_DEFINES_PRODUCTION" ]; then
              echo "::error::SOI_DART_DEFINES_PRODUCTION is not set. Refusing to build a production upload against the default configuration."
              exit 1
            fi
            SOI_DART_DEFINES="$SOI_DART_DEFINES_PRODUCTION"
            echo "Building with the production configuration."
          fi
          test -n "$SOI_DART_DEFINES"
          test -n "$SOI_UPLOAD_KEYSTORE_BASE64"
          test -n "$SOI_UPLOAD_STORE_PASSWORD"
          test -n "$SOI_UPLOAD_KEY_ALIAS"
          test -n "$SOI_UPLOAD_KEY_PASSWORD"
          printf '%s' "$SOI_DART_DEFINES" > .env
          printf '%s' "$SOI_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/soi-release.keystore
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          SOI_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/android/soi-release.keystore
          SOI_UPLOAD_STORE_PASSWORD=$SOI_UPLOAD_STORE_PASSWORD
          SOI_UPLOAD_KEY_ALIAS=$SOI_UPLOAD_KEY_ALIAS
          SOI_UPLOAD_KEY_PASSWORD=$SOI_UPLOAD_KEY_PASSWORD
          EOF

      - name: Choose Android build number
        id: number
        run: |
          if [ -z "$ANDROID_BUILD_NUMBER" ]; then
            ANDROID_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          fi
          VERSION_NAME=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "BUILD_NUMBER=$ANDROID_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$ANDROID_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION_NAME build $ANDROID_BUILD_NUMBER"

      - name: Build signed Android packages
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-number "$BUILD_NUMBER"
          flutter build apk --release \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-number "$BUILD_NUMBER"

      - name: Install bundletool
        run: |
          curl --fail --location --output bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Verify signer and manifest
        shell: pwsh
        run: |
          ./tools/verify-aab-signer.ps1 build/app/outputs/bundle/release/app-release.aab
          ./tools/check-manifest.ps1 `
            -Path build/app/outputs/bundle/release/app-release.aab `
            -Bundletool bundletool.jar

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp build/app/outputs/bundle/release/app-release.aab release-files/soi-${BUILD_NUMBER}.aab
          cp build/app/outputs/flutter-apk/app-release.apk release-files/soi-${BUILD_NUMBER}.apk
          tar -czf release-files/soi-${BUILD_NUMBER}-symbols.tar.gz -C build symbols
          cp build/app/outputs/mapping/release/mapping.txt release-files/soi-${BUILD_NUMBER}-mapping.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soi-android-${{ env.BUILD_NUMBER }}
          path: release-files/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.BUILD_NUMBER }}
          name: SOI Android ${{ env.BUILD_NUMBER }}
          generate_release_notes: true
          files: release-files/*

  # Manual runs only. The environment is play-<track>, so protection rules
  # (required reviewers on play-production) gate the upload after the build
  # has already been verified.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
    needs: release
    runs-on: ubuntu-latest
    environment: play-${{ inputs.play_track }}
    env:
      BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
      VERSION_NAME: ${{ needs.release.outputs.version_name }}
      PLAY_TRACK: ${{ inputs.play_track }}
      ROLLOUT_FRACTION: ${{ inputs.rollout_fraction }}

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: distribution

      - name: Download the verified bundle
        uses: actions/download-artifact@v4
        with:
          name: soi-android-${{ env.BUILD_NUMBER }}
          path: release-files

      - name: Decide release status
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set (repository or play-$PLAY_TRACK environment secret)."
            exit 1
          fi
          test -f "release-files/soi-${BUILD_NUMBER}.aab"
          test -f "release-files/soi-${BUILD_NUMBER}-mapping.txt"
          test -f distribution/whatsnew/whatsnew-en-US
          STATUS=completed
          USER_FRACTION=
          if [ "$PLAY_TRACK" = production ]; then
            if ! awk -v f="$ROLLOUT_FRACTION" 'BEGIN { exit !(f + 0 > 0 && f + 0 <= 1) }'; then
              echo "::error::rollout_fraction must be between 0.01 and 1, got '$ROLLOUT_FRACTION'."
              exit 1
            fi
            if awk -v f="$ROLLOUT_FRACTION" 'BEGIN { exit !(f + 0 < 1) }'; then
              STATUS=inProgress
              USER_FRACTION=$ROLLOUT_FRACTION
            fi
          fi
          echo "STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "USER_FRACTION=$USER_FRACTION" >> "$GITHUB_ENV"
          echo "Track $PLAY_TRACK, status $STATUS, user fraction '${USER_FRACTION:-all}', version $VERSION_NAME ($BUILD_NUMBER)"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.swagofindia.soi
          releaseFiles: release-files/soi-${{ env.BUILD_NUMBER }}.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.BUILD_NUMBER }})
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.STATUS }}
          userFraction: ${{ env.USER_FRACTION }}
          mappingFile: release-files/soi-${{ env.BUILD_NUMBER }}-mapping.txt
          whatsNewDirectory: distribution/whatsnew
